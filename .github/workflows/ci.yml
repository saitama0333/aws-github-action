name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-24.04

    outputs:
      alb_dns_name: ${{ steps.alb.outputs.alb_dns_name }}

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Debug GitHub OIDC context
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_SHA=$GITHUB_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::960645511169:role/saitama-github-action-dev-github-actions
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../..

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Export ALB DNS
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region ap-south-1 \
            --names saitama-github-action-dev-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "ALB was not found."
            exit 1
          fi

          echo "ALB DNS: $ALB_DNS"
          echo "alb_dns_name=$ALB_DNS" >> "$GITHUB_OUTPUT"

  terraform-security:
    name: Terraform Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          hide-progress: true
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build, Scan, Push and Deploy
    needs: terraform
    runs-on: ubuntu-24.04

    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 960645511169.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: saitama-github-action/dev/app
      IMAGE_TAG: ${{ github.sha }}
      ECS_CLUSTER: saitama-github-action-dev
      ECS_SERVICE: saitama-github-action-dev
      ECS_TASK_DEFINITION: saitama-github-action-dev
      ECS_CONTAINER_NAME: app

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::960645511169:role/saitama-github-action-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Capture current ECS task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          PREVIOUS_TASK_DEFINITION=$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ -z "$PREVIOUS_TASK_DEFINITION" ] || [ "$PREVIOUS_TASK_DEFINITION" = "None" ]; then
            echo "Could not determine current ECS task definition."
            exit 1
          fi

          echo "Previous task definition: $PREVIOUS_TASK_DEFINITION"
          echo "PREVIOUS_TASK_DEFINITION=$PREVIOUS_TASK_DEFINITION" >> "$GITHUB_ENV"

      - name: Download current ECS task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render new image in ECS task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Update application version
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          TASK_DEFINITION_FILE: ${{ steps.render-task-definition.outputs.task-definition }}
        run: |
          jq \
            --arg version "$IMAGE_TAG" \
            '(.containerDefinitions[] | select(.name == "app") | .environment) |= map(if .name == "APP_VERSION" then .value = $version else . end)' \
            "$TASK_DEFINITION_FILE" > task-definition-versioned.json

          mv task-definition-versioned.json "$TASK_DEFINITION_FILE"

      - name: Deploy to Amazon ECS
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Smoke test application
        id: smoke-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          ALB_DNS: ${{ needs.terraform.outputs.alb_dns_name }}
        run: |
          echo "Testing http://${ALB_DNS}/health"

          for attempt in {1..10}; do
            if curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              "http://${ALB_DNS}/health"; then
              echo
              echo "Smoke test passed."
              exit 0
            fi

            echo "Attempt ${attempt}/10 failed. Waiting 10 seconds..."
            sleep 10
          done

          echo "Smoke test failed."
          exit 1

      - name: Roll back ECS deployment
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && env.PREVIOUS_TASK_DEFINITION != ''
        run: |
          echo "Deployment failed."
          echo "Rolling back ECS service to:"
          echo "$PREVIOUS_TASK_DEFINITION"

          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_TASK_DEFINITION" \
            --force-new-deployment

          echo "Waiting for ECS rollback to stabilize..."

          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS rollback completed successfully."

      - name: Verify rollback
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && env.PREVIOUS_TASK_DEFINITION != ''
        run: |
          CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current task definition after rollback:"
          echo "$CURRENT_TASK_DEFINITION"

          if [ "$CURRENT_TASK_DEFINITION" != "$PREVIOUS_TASK_DEFINITION" ]; then
            echo "Rollback verification failed."
            exit 1
          fi

          echo "Rollback verified successfully."
